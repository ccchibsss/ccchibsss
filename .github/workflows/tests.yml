name: tests

on:
  push:
  pull_request:

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Синтаксис движка
        run: python -m py_compile engine/uc_engine.py
      - name: Тесты движка (stdlib-only)
        run: python -m unittest discover -s engine/tests -v

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Тесты приложения (без зависимостей)
        run: node tests/run-tests.js
      - name: IndexedDB источники — встроенный Dexie
        run: |
          npm install --prefix .arena/idb-tests fake-indexeddb@6.2.8 --no-save --no-audit --no-fund
          NODE_PATH=.arena/idb-tests/node_modules node tests/browser-import-sources-indexeddb.js
          NODE_PATH=.arena/idb-tests/node_modules node tests/browser-apply-checkpoint-indexeddb.js
          NODE_PATH=.arena/idb-tests/node_modules node tests/browser-catalog-lookup-indexeddb.js
          NODE_PATH=.arena/idb-tests/node_modules node tests/persist-indexeddb-probe.js
      - name: Браузерный импорт — Chromium smoke
        run: |
          npm install --prefix .arena/browser-tests playwright-core@1.58.2 @sparticuz/chromium@143.0.4 --no-save --no-audit --no-fund
          E2E_ROWS=1000 NODE_PATH=.arena/browser-tests/node_modules node tests/browser-import-e2e.js
          E2E_STAGE_ONLY=1 E2E_ROWS=1000000 NODE_PATH=.arena/browser-tests/node_modules node tests/browser-import-e2e.js
