name: tests

on:
  push:
  pull_request:

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Синтаксис движка
        run: python -m py_compile engine/uc_engine.py
      - name: Тесты движка (stdlib-only)
        run: python -m unittest discover -s engine/tests -v

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Тесты приложения (без зависимостей)
        run: node tests/run-tests.js
      - name: IndexedDB источники — встроенный Dexie
        run: |
          npm install --prefix .arena/idb-tests fake-indexeddb@6.2.8 --no-save --no-audit --no-fund
          NODE_PATH=.arena/idb-tests/node_modules node tests/browser-import-sources-indexeddb.js
