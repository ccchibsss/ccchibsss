name: tests

on:
  push:
  pull_request:

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Синтаксис движка
        run: python -m py_compile engine/uc_engine.py
      - name: Тесты движка (stdlib-only)
        run: python -m unittest discover -s engine/tests -v

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Тесты приложения (без зависимостей)
        run: |
          node tests/run-tests.js
          node tests/console-log-regressions-client.js
          node tests/volatile-storage-client.js
          node tests/sql-memory-client.js
          node tests/sql-memory-guards-client.js
          node tests/browser-worker-memory-client.js
          node tests/export-spool-client.js
          node tests/enrichment-lifecycle-client.js
          node tests/enrichment-rules-client.js
          node tests/import-enrichment-keys-client.js
          node tests/hvc-chunked-client.js
          node tests/ozon-concurrent-settings-client.js
          node tests/ozon-reference-upload-client.js
          node tests/import-apply-status-client.js
          node tests/product-byte-batches-client.js
          node tests/csv-encoding-and-identity-bulk-client.js
      - name: IndexedDB источники — встроенный Dexie
        run: |
          npm install --prefix .arena/idb-tests fake-indexeddb@6.2.8 --no-save --no-audit --no-fund
          NODE_PATH=.arena/idb-tests/node_modules node tests/browser-import-sources-indexeddb.js
          NODE_PATH=.arena/idb-tests/node_modules node tests/browser-key-pages-indexeddb.js
          NODE_PATH=.arena/idb-tests/node_modules node tests/hvc-stream-load-indexeddb.js
          NODE_PATH=.arena/idb-tests/node_modules node tests/hvc-pages-indexeddb.js
          NODE_PATH=.arena/idb-tests/node_modules node tests/browser-apply-checkpoint-indexeddb.js
          NODE_PATH=.arena/idb-tests/node_modules node tests/browser-catalog-lookup-indexeddb.js
          NODE_PATH=.arena/idb-tests/node_modules node tests/persist-indexeddb-probe.js
          NODE_PATH=.arena/idb-tests/node_modules node tests/product-key-reconcile-indexeddb.js
          NODE_PATH=.arena/idb-tests/node_modules node tests/source-registry-indexeddb.js
      - name: Браузерный импорт — Chromium smoke
        run: |
          mkdir -p .arena
          # Keep the failing browser's diagnostics visible in check annotations,
          # even when the runner's external log-download host is inaccessible.
          exec > >(tee .arena/browser-smoke.log) 2>&1
          trap 'code=$?; tail -n 25 .arena/browser-smoke.log | while IFS= read -r line; do line=${line//%/%25}; line=${line//$"\r"/%0D}; echo "::error::$line"; done; exit "$code"' ERR
          npm install --prefix .arena/browser-tests playwright-core@1.58.2 @sparticuz/chromium@143.0.4 --no-save --no-audit --no-fund
          NODE_PATH=.arena/browser-tests/node_modules node tests/browser-worker-memory-e2e.js
          NODE_PATH=.arena/browser-tests/node_modules node tests/browser-ozon-stream-xlsx-e2e.js
          E2E_ROWS=20000 NODE_PATH=.arena/browser-tests/node_modules node tests/browser-io-memory-e2e.js
          NODE_PATH=.arena/browser-tests/node_modules node tests/browser-sql-paged-import-e2e.js
          E2E_ROWS=60000 NODE_PATH=.arena/browser-tests/node_modules node tests/browser-first-price-boot-e2e.js
          NODE_PATH=.arena/browser-tests/node_modules node tests/browser-volatile-boot-e2e.js
          NODE_PATH=.arena/browser-tests/node_modules node tests/browser-key-index-perf-e2e.js
          NODE_PATH=.arena/browser-tests/node_modules node tests/browser-enrichment-parity-e2e.js
          NODE_PATH=.arena/browser-tests/node_modules node tests/browser-wide-values-e2e.js
          E2E_PRICE_ENRICHED=1 NODE_PATH=.arena/browser-tests/node_modules node tests/browser-wide-values-e2e.js
          REPEAT_ROWS=1000 NODE_PATH=.arena/browser-tests/node_modules node tests/browser-import-repeat-memory-e2e.js
          NODE_PATH=.arena/browser-tests/node_modules node tests/browser-import-abort-e2e.js
          NODE_PATH=.arena/browser-tests/node_modules node tests/browser-import-conflict-e2e.js
          NODE_PATH=.arena/browser-tests/node_modules node tests/browser-export-e2e.js
          E2E_ROWS=1000 NODE_PATH=.arena/browser-tests/node_modules node tests/browser-import-e2e.js
          E2E_ROWS=30000 E2E_PARTIAL_WRITE=1 E2E_TIMEOUT_MS=180000 NODE_PATH=.arena/browser-tests/node_modules node tests/browser-import-e2e.js
          E2E_STAGE_ONLY=1 E2E_PREFLIGHT=1 E2E_TARGET_INDEX=1 E2E_TIMEOUT_MS=300000 E2E_ROWS=1000000 NODE_PATH=.arena/browser-tests/node_modules node tests/browser-import-e2e.js
