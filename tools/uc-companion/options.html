<!DOCTYPE html>
<html lang="ru">
<head><meta charset="utf-8"><title>UNIT CONTROL — ключи площадок</title></head>
<body style="font-family:system-ui,sans-serif;max-width:520px;margin:24px auto;padding:0 16px">
  <h2>Ключи площадок</h2>
  <p>Хранятся только в этом расширении (chrome.storage.local) и не передаются в страницу приложения.</p>
  <label style="display:block;margin:12px 0 4px">Ozon Client-Id</label>
  <input id="ozonClientId" style="width:100%;padding:8px" autocomplete="off">
  <label style="display:block;margin:12px 0 4px">Ozon Api-Key</label>
  <input id="ozonApiKey" type="password" style="width:100%;padding:8px" autocomplete="off">
  <button id="save" style="margin-top:16px;padding:9px 18px">Сохранить</button>
  <span id="st" style="margin-left:10px"></span>
  <script src="options.js"></script>
</body>
</html>
